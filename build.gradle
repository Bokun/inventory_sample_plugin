plugins {
    id 'java'
    id 'application'
    id 'idea'
    id 'com.gradleup.shadow' version '9.6.1'
}

group = 'bokun'
version = '0.5.3'         // should match the one in API and inventory service

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(25)
    }
}

// This thingie below will ensure all dependencies are always fetched when running from IntelliJ
// It should not be there by default and only uncommented when necessary, followed by IntelliJ Gradle refresh
//configurations.all {
//    resolutionStrategy.cacheDynamicVersionsFor 0, 'hours'
//    resolutionStrategy.cacheChangingModulesFor 0, 'hours'
//}

def buildNumber = project.findProperty('buildNo') ?: 'DEV'
def baseName = project.name
def jsonName = "${baseName}-${buildNumber}.json"
def dockerName = "${group}/${baseName}:${buildNumber}"

repositories {
    mavenCentral()
    // Inventory Service API (common-api, plugin-api); public, no credentials needed
    maven {
        url = 'https://s3.eu-west-1.amazonaws.com/public-pmr.bokun.io/release'
        content {
            includeGroup 'io.bokun.inventory'
        }
    }
}

dependencies {
    implementation 'io.bokun.inventory:common-api:0.5.4'
    implementation 'io.bokun.inventory:plugin-api:0.5.4'

    // The API jars don't declare their dependencies: generated gRPC code needs grpc-protobuf/grpc-stub, REST models need Gson
    implementation platform('io.grpc:grpc-bom:1.84.2')
    implementation 'io.grpc:grpc-netty'
    implementation 'io.grpc:grpc-protobuf'
    implementation 'io.grpc:grpc-stub'
    implementation 'com.google.code.gson:gson:2.14.0'

    implementation 'com.google.code.findbugs:jsr305:3.0.2'
    implementation 'org.slf4j:slf4j-api:2.0.20'
    runtimeOnly 'org.apache.logging.log4j:log4j-slf4j2-impl:2.26.1'
    runtimeOnly 'org.apache.logging.log4j:log4j-core:2.26.1'
    implementation 'com.google.guava:guava:33.7.2-jre'
    implementation 'com.squareup.okhttp3:okhttp:5.5.0'
    // Guice 7.0.0 shades ASM 9.5, which can't read Java 25 class files (breaks source locations in Guice errors).
    // Use the unshaded 'classes' jar with a current ASM instead; drop once a Guice release bundles a newer ASM.
    implementation 'com.google.inject:guice:7.0.0:classes'
    implementation 'org.ow2.asm:asm:9.10.1'
    implementation 'io.undertow:undertow-core:2.4.4.Final'
}

idea {
    module {
        sourceDirs += file("${projectDir}/src/generated/main/java")
        sourceDirs += file("${projectDir}/src/generated/main/grpc")
    }
}

// Guice 7 and protobuf use sun.misc.Unsafe memory access.
// It only prints warnings on JDK 25; allow it explicitly. Keep in sync with src/main/docker/Dockerfile.
def jdkCompatibilityJvmArgs = ['--sun-misc-unsafe-memory-access=allow']

application {
    mainClass = 'io.bokun.inventory.plugin.sample.Main'
    applicationDefaultJvmArgs = jdkCompatibilityJvmArgs
}

startScripts.enabled = false

tasks.register('sourceJava', Jar) {
    from sourceSets.main.allJava
}

// Executable jar with all dependencies, used by the Docker image
shadowJar {
    archiveFileName = "${baseName}.jar"
    // Keep the first copy of duplicate classes, but let the transformers below see every copy of the files they merge
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
    filesMatching(['META-INF/services/**', 'META-INF/*.kotlin_module', '**/Log4j2Plugins.dat']) {
        duplicatesStrategy = DuplicatesStrategy.INCLUDE
    }
    mergeServiceFiles()
}

tasks.register('createJsonAWS', Copy) {
    dependsOn clean
    from 'src/main/docker/aws.json'
    into layout.buildDirectory.dir('bundle')
    expand(dockerName: dockerName)
    rename { String fileName ->
        fileName.replace('aws.json', jsonName)
    }
}

tasks.register('stageDocker', Sync) {
    from shadowJar
    from 'src/main/docker/Dockerfile'
    into layout.buildDirectory.dir('docker')
}

tasks.register('buildDocker', Exec) {
    dependsOn build, stageDocker
    workingDir layout.buildDirectory.dir('docker')
    commandLine 'docker', 'build', '-t', dockerName, '.'
}
